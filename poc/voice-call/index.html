<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bot voice comparison</title>
<style>body{max-width:820px;margin:24px auto;padding:0 16px;font:17px system-ui;background:#101418;color:#e8edf2}label{display:block;margin:14px 0}select,button{font:inherit;padding:10px;border-radius:6px;max-width:100%}button{margin:8px 8px 8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1c252c;padding:16px;max-height:52vh;overflow:auto}small{color:#acbcc8}#state{color:#9edabd}</style></head>
<body><h1>Talk to your bot</h1><p>Compare a hosted voice agent with your own response model. This is a throwaway prototype using copied data.</p>
<label>Bot <select id="bot"></select></label>
<label>Variant <select id="variant"><option value="engine">Speech Engine</option><option value="agent">ElevenLabs Agent</option></select></label>
<label><input type="checkbox" id="buffer"> Speak an instant buffer phrase</label>
<label>Response model <select id="response"></select></label>
<label>Thinking model <select id="thinking"><option value="bot">The bot's own agent</option></select></label>
<label>Hosted agent LLM <select id="hosted"></select></label>
<button id="call">Call</button><button id="hangup" disabled>Hang up</button><p id="state">Loading</p>
<small id="voice"></small><pre id="log" role="log" aria-live="polite"></pre><script type="module" src="client.js"></script></body></html>
